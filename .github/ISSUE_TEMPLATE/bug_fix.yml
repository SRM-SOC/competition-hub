name: Bug Fix
description: Report a bug to be fixed
labels: ["bug-fix"]
body:
  - type: input
    id: title
    label: Brief description of the bug
    validations:
      required: true
  - type: textarea
    id: reproduce
    label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    label: Expected behaviour
  - type: textarea
    id: actual
    label: Actual behaviour
  - type: dropdown
    id: difficulty
    label: Difficulty
    options:
      - easy
      - medium
      - hard
    validations:
      required: true