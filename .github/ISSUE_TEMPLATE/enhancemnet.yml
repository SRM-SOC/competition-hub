name: Enhancement
description: Suggest an enhancement or improvement
labels: ["enhancement"]

body:
  - type: textarea
    id: description
    attributes:
      label: Enhancement description
    validations:
      required: true

  - type: textarea
    id: spec
    attributes:
      label: Detailed spec / acceptance criteria
    validations:
      required: true

  - type: dropdown
    id: difficulty
    attributes:
      label: Difficulty
      options:
        - medium
        - hard
    validations:
      required: true